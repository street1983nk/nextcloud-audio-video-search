name: Python gates

# Mirrors Findling's python.yml. Every action is pinned to a commit SHA with an
# exact version comment (tests/test_workflow_pins.py); a tag can be moved and
# would hand a third party code execution in this build.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push on top of a push makes the older verdict worthless.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

# The ExApp half lives in backend/; every run step works there. The shared
# scripts at the repository root are reached as ../scripts.
defaults:
  run:
    working-directory: backend

jobs:
  gates:
    name: ruff, format, pyright, vulture, pytest, shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv release that wrote uv.lock, so --frozen resolves the same here and locally.
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # ruff takes the directory it is given; the shared scripts sit outside backend/.
      - name: Lint and format check of the shared scripts
        run: |
          uv run ruff check ../scripts
          uv run ruff format --check ../scripts

      - name: Type check
        env:
          # The pyright release CI runs, also locally (owner rule).
          PYRIGHT_PYTHON_FORCE_VERSION: latest
        run: uv run pyright

      - name: Dead code
        # Paths and confidence come from [tool.vulture] in pyproject.toml.
        run: uv run vulture

      - name: Shell check of the image and release scripts
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck docker/entrypoint.sh docker/healthcheck.sh ../scripts/release/store-archive.sh ../scripts/ci/head_green.sh ../ci/redeploy.sh ../ci/admin-state.sh

      # The Dockerfile linter, as a pinned PyPI wheel so it runs without Docker.
      # tests/test_dockerfile.py holds the project rules on top of it.
      - name: Dockerfile lint
        run: uvx --from hadolint-py==2.15.1.3 hadolint Dockerfile

      # The media tests decode with the ffmpeg the image ships: same BtbN release,
      # same asset, same checksum as the ffmpeg stage of the Dockerfile
      # (tests/test_dockerfile.py holds the two in step). Under CI=true a media
      # test without its encoder fails instead of skipping.
      - name: Install the pinned LGPL ffmpeg
        run: |
          set -euo pipefail
          FFMPEG_RELEASE=autobuild-2026-10-31-12-59
          FFMPEG_BUILD=ffmpeg-n8.1.3-27-g8dca1586f4
          FFMPEG_AMD64_SHA256=a64f3171e6ad1f7d358d28890a907ee478c331d1177ec696a93418f79ac3f1f3
          FFMPEG_ARCH=linux64-lgpl-8.1
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_BUILD}-${FFMPEG_ARCH}.tar.xz"
          echo "${FFMPEG_AMD64_SHA256}  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" \
            "${FFMPEG_BUILD}-${FFMPEG_ARCH}/bin/ffmpeg" "${FFMPEG_BUILD}-${FFMPEG_ARCH}/bin/ffprobe"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -version
          "$RUNNER_TEMP/ffmpeg/ffprobe" -version > /dev/null
          echo "AVS_FFMPEG=$RUNNER_TEMP/ffmpeg/ffmpeg" >> "$GITHUB_ENV"
          echo "AVS_FFPROBE=$RUNNER_TEMP/ffmpeg/ffprobe" >> "$GITHUB_ENV"

      # -rs names every skip with its reason; the coverage floor (fail_under in
      # pyproject.toml) rides along, so a feature without tests fails here.
      - name: Tests
        run: uv run pytest -q -rs --cov=src/audio_video_search_backend --cov-report=term
