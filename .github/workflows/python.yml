name: Python gates

# Mirrors Findling's python.yml. Every action is pinned to a commit SHA with an
# exact version comment (tests/test_workflow_pins.py); a tag can be moved and
# would hand a third party code execution in this build.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push on top of a push makes the older verdict worthless.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

# The ExApp half lives in backend/; every run step works there. The shared
# scripts at the repository root are reached as ../scripts.
defaults:
  run:
    working-directory: backend

jobs:
  gates:
    name: ruff, format, pyright, vulture, pytest, shellcheck
    runs-on: ubuntu-24.04
    # The first run on a new model pin downloads about 670 MB before the tests.
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv release that wrote uv.lock, so --frozen resolves the same here and locally.
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # ruff takes the directory it is given; the shared scripts sit outside backend/.
      - name: Lint and format check of the shared scripts
        run: |
          uv run ruff check ../scripts
          uv run ruff format --check ../scripts

      - name: Type check
        env:
          # The pyright release CI runs, also locally (owner rule).
          PYRIGHT_PYTHON_FORCE_VERSION: latest
        run: uv run pyright

      - name: Dead code
        # Paths and confidence come from [tool.vulture] in pyproject.toml.
        run: uv run vulture

      - name: Shell check of the image and release scripts
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck docker/entrypoint.sh docker/healthcheck.sh ../scripts/release/store-archive.sh ../scripts/ci/head_green.sh ../ci/redeploy.sh ../ci/admin-state.sh

      # The Dockerfile linter, as a pinned PyPI wheel so it runs without Docker.
      # tests/test_dockerfile.py holds the project rules on top of it.
      - name: Dockerfile lint
        run: uvx --from hadolint-py==2.15.1.3 hadolint Dockerfile

      # The media tests decode with the ffmpeg the image ships: same BtbN release,
      # same asset, same checksum as the ffmpeg stage of the Dockerfile
      # (tests/test_dockerfile.py holds the two in step). Under CI=true a media
      # test without its encoder fails instead of skipping.
      - name: Install the pinned LGPL ffmpeg
        run: |
          set -euo pipefail
          FFMPEG_RELEASE=autobuild-2026-10-31-12-59
          FFMPEG_BUILD=ffmpeg-n8.1.3-27-g8dca1586f4
          FFMPEG_AMD64_SHA256=a64f3171e6ad1f7d358d28890a907ee478c331d1177ec696a93418f79ac3f1f3
          FFMPEG_ARCH=linux64-lgpl-8.1
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_BUILD}-${FFMPEG_ARCH}.tar.xz"
          echo "${FFMPEG_AMD64_SHA256}  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" \
            "${FFMPEG_BUILD}-${FFMPEG_ARCH}/bin/ffmpeg" "${FFMPEG_BUILD}-${FFMPEG_ARCH}/bin/ffprobe"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -version
          "$RUNNER_TEMP/ffmpeg/ffprobe" -version > /dev/null
          echo "AVS_FFMPEG=$RUNNER_TEMP/ffmpeg/ffmpeg" >> "$GITHUB_ENV"
          echo "AVS_FFPROBE=$RUNNER_TEMP/ffmpeg/ffprobe" >> "$GITHUB_ENV"

      # The model tests (tests/test_engine_model.py) run Parakeet on the pinned FLEURS
      # clips. Models and clips come from a cache keyed by their sha256 (MODEL_SHA256 of
      # models/catalog.py; the member sha256 of ci/media/fetch_speech.py plus the sha256
      # of the ffmpeg that turned them into WAV). A cache entry never replaces the model
      # check: the verdict files of procure are not cached, so the test hashes every model
      # file again. A clip is only cached after fetch_speech.py checked its member sha256;
      # its WAV sha256 is compared after every restore and, like fetch_speech.py itself
      # does, only warned about when another ffmpeg build wrote it.
      - name: Cache keys of the speech models and clips
        id: speech-keys
        run: |
          set -euo pipefail
          MODELS_KEY="avs-models-$(uv run python -c 'from audio_video_search_backend.models.catalog import MODEL_SHA256; print(MODEL_SHA256)')"
          FFMPEG_SHA256="$(sha256sum "$AVS_FFMPEG" | cut -c1-64)"
          SPEECH_KEY="avs-speech-$(uv run python -I -c 'import hashlib, runpy, sys; m = runpy.run_path("../ci/media/fetch_speech.py"); print(hashlib.sha256(",".join([*sorted(c.member_sha256 for c in m["CLIPS"]), sys.argv[1]]).encode()).hexdigest())' "$FFMPEG_SHA256")"
          echo "models=$MODELS_KEY" >> "$GITHUB_OUTPUT"
          echo "speech=$SPEECH_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore the speech models
        id: models-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/avs-models
            !${{ runner.temp }}/avs-models/**/*.verified.json
          key: ${{ steps.speech-keys.outputs.models }}

      - name: Fetch the speech models on a cache miss
        if: steps.models-cache.outputs.cache-hit != 'true'
        run: uv run python -m audio_video_search_backend.models.procure --root "$RUNNER_TEMP/avs-models"

      - name: Restore the speech clips
        id: speech-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/avs-speech
          key: ${{ steps.speech-keys.outputs.speech }}

      - name: Fetch the speech clips on a cache miss
        if: steps.speech-cache.outputs.cache-hit != 'true'
        run: uv run python -I ../ci/media/fetch_speech.py "$RUNNER_TEMP/avs-speech"

      - name: Check the speech clips and hand them to the tests
        run: |
          set -euo pipefail
          uv run python -I -c 'import hashlib, pathlib, runpy, sys; m = runpy.run_path("../ci/media/fetch_speech.py"); d = pathlib.Path(sys.argv[1]); [print(f"::warning::{c.name} wav sha256 {h} differs from {c.wav_sha256} (other ffmpeg build)") for c in m["CLIPS"] if (h := hashlib.sha256((d / c.name).read_bytes()).hexdigest()) != c.wav_sha256]' "$RUNNER_TEMP/avs-speech"
          WORD="$(uv run python -I -c 'import runpy; print(runpy.run_path("../ci/media/fetch_speech.py")["EXPECTED_WORD"])')"
          echo "AVS_TEST_MODELS=$RUNNER_TEMP/avs-models" >> "$GITHUB_ENV"
          echo "AVS_TEST_SPEECH=$RUNNER_TEMP/avs-speech/speech_de.wav" >> "$GITHUB_ENV"
          echo "AVS_TEST_SPEECH_TR=$RUNNER_TEMP/avs-speech/speech_tr.wav" >> "$GITHUB_ENV"
          echo "AVS_TEST_SPEECH_ES=$RUNNER_TEMP/avs-speech/speech_es.wav" >> "$GITHUB_ENV"
          echo "AVS_TEST_WORD=$WORD" >> "$GITHUB_ENV"

      # -rs names every skip with its reason; the coverage floor (fail_under in
      # pyproject.toml) rides along, so a feature without tests fails here.
      - name: Tests
        run: uv run pytest -q -rs --cov=src/audio_video_search_backend --cov-report=term
